<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markha RSVP – Host</title>
<meta name="description" content="Markha Christmas &amp; Year End Party · December 19, 7:00 pm · RSVP closes by Nov 14 · Limited seats only">
<meta property="og:title" content="Markha Christmas &amp; Year End Party">
<meta property="og:description" content="December 19, 7:00 pm · RSVP closes by Nov 14 · Limited seats only">
<meta property="og:image" content="/invite.jpg">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6E0B14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%236E0B14'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%23F2EEE2' font-family='Georgia,serif'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap">
<style>
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: the invitation is the cover; an arched cream reply card sits beside it (stacked on phones), all on a woven tartan ground. Single deliberate look in both themes. */
:root {
  --cream: #F2EEE2;
  --cream-deep: #E6DFCC;
  --ink: #2C2826;
  --ink-soft: #6A5F58;
  --burgundy: #6E0B14;
  --red: #A8141C;
  --forest: #17322A;
  --gold: #B8913F;
  --rule: #CDBFA6;
  --font-script: "Pinyon Script", "Snell Roundhand", cursive;
  --font-display: "Bodoni Moda", "Didot", Georgia, serif;
  --font-body: "Jost", "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background-color: var(--burgundy);
  background-image:
    repeating-linear-gradient(90deg, rgba(23,50,42,.55) 0 38px, transparent 38px 76px, rgba(23,50,42,.35) 76px 84px, transparent 84px 152px),
    repeating-linear-gradient(0deg, rgba(23,50,42,.55) 0 38px, transparent 38px 76px, rgba(23,50,42,.35) 76px 84px, transparent 84px 152px),
    repeating-linear-gradient(90deg, transparent 0 112px, rgba(184,145,63,.55) 112px 114px, transparent 114px 152px),
    repeating-linear-gradient(0deg, transparent 0 112px, rgba(184,145,63,.55) 112px 114px, transparent 114px 152px),
    repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 40px;
  align-items: start;
}
.cover { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); }
.cover img {
  display: block; width: 100%; height: auto;
  border-radius: 4px;
  box-shadow: 0 2px 0 rgba(0,0,0,.25), 0 24px 60px rgba(0,0,0,.45);
}
.cover-note {
  margin-top: 14px; text-align: center; color: var(--cream);
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .85;
}
.reply-link { display: none; }

.card {
  background: var(--cream);
  border-radius: 999px 999px 6px 6px / 260px 260px 6px 6px;
  padding: 72px clamp(20px, 5vw, 56px) 44px;
  box-shadow: 0 24px 60px rgba(0,0,0,.4);
  outline: 1px solid var(--burgundy);
  outline-offset: -10px;
  display: grid; gap: 28px;
  min-width: 0;
}
.head { text-align: center; display: grid; gap: 2px; }
.eyebrow { font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: var(--ink); }
.countdown { display: flex; justify-content: center; gap: 8px; margin: 10px 0 14px; }
.countdown div { display: grid; justify-items: center; min-width: 58px; padding: 8px 6px 6px; border: 1px solid var(--burgundy); border-radius: 3px; background: #FBF9F3; }
.countdown b { font-family: var(--font-display); font-weight: 500; font-size: 26px; line-height: 1; color: var(--red); font-variant-numeric: tabular-nums; }
.countdown span { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
.cd-closed { margin: 10px 0 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--red); }
@media (max-width: 400px) { .countdown { gap: 6px; } .countdown div { min-width: 0; flex: 1; } .countdown b { font-size: 22px; } }
.head h1 { margin: 0; font-weight: normal; line-height: 1; }
.head .script-name { font-family: var(--font-script); font-size: clamp(56px, 9vw, 84px); color: var(--ink); display: block; }
.head .caps { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 4vw, 34px); color: var(--red); letter-spacing: .02em; display: block; margin-top: -4px; text-wrap: balance; }
.when {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  border-top: 1px dotted var(--ink); border-bottom: 1px dotted var(--ink);
  padding-block: 10px; margin-top: 14px; font-size: 17px;
}
.when b { font-family: var(--font-display); font-size: 30px; color: var(--red); font-weight: 500; line-height: 1; }

form { display: grid; gap: 20px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend, label.lbl { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; padding: 0; margin-bottom: 8px; }
label.lbl { margin-bottom: 0; }
.field { display: grid; gap: 8px; min-width: 0; }
input[type=text], textarea, select {
  width: 100%; font: inherit; color: var(--ink);
  background: #FBF9F3; border: 1px solid var(--rule); border-radius: 3px;
  padding: 11px 12px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, .choice input:focus-visible + span {
  outline: 2px solid var(--gold); outline-offset: 2px;
}
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span {
  display: grid; gap: 2px; text-align: center; padding: 14px 10px;
  border: 1px solid var(--rule); border-radius: 3px; background: #FBF9F3; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.choice span strong { font-family: var(--font-script); font-weight: normal; font-size: 30px; line-height: 1.1; }
.choice span small { font-size: 12px; color: var(--ink-soft); letter-spacing: .06em; }
.choice input:checked + span { background: var(--burgundy); border-color: var(--burgundy); color: var(--cream); }
.choice input:checked + span small { color: var(--cream-deep); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.hint { font-size: 13px; color: var(--ink-soft); }
.stepper { display: flex; align-items: center; border: 1px solid var(--rule); border-radius: 3px; background: #FBF9F3; width: max-content; }
.stepper button { font: inherit; font-size: 20px; width: 44px; height: 44px; border: 0; background: transparent; color: var(--burgundy); cursor: pointer; }
.stepper button:disabled { color: var(--rule); cursor: default; }
.stepper output { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
.submit {
  font: inherit; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: 14px;
  background: var(--red); color: var(--cream); border: 0; border-radius: 3px;
  padding: 16px 20px; cursor: pointer; transition: background .15s;
}
.submit:hover { background: var(--burgundy); }
.submit:disabled { opacity: .6; cursor: progress; }
.status { font-size: 14px; min-height: 1.2em; text-align: center; color: var(--ink-soft); }
.status.err { color: var(--red); }

.seats-note { margin: 0; text-align: center; font-size: 15px; line-height: 1.5; color: var(--burgundy); border: 1px solid var(--burgundy); border-radius: 3px; padding: 12px 16px; background: #FBF9F3; text-wrap: balance; }
.seats-note strong { letter-spacing: .14em; text-transform: uppercase; font-size: 12px; margin-right: 4px; }
.seats-note b { font-weight: 600; }
.field-help { margin: -2px 0 0; font-size: 14px; color: var(--ink-soft); }
.check { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--rule); border-radius: 3px; background: #FBF9F3; cursor: pointer; position: relative; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check .box { flex: none; width: 24px; height: 24px; border: 1.5px solid var(--burgundy); border-radius: 3px; display: grid; place-items: center; background: #fff; transition: background .15s; }
.check .box::after { content: ""; width: 7px; height: 13px; border: solid var(--cream); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.check input:checked + .box { background: var(--burgundy); }
.check input:checked + .box::after { opacity: 1; }
.check input:focus-visible + .box { outline: 2px solid var(--gold); outline-offset: 2px; }
.check strong { color: var(--red); font-weight: 600; }
.notice { background: var(--cream-deep); border-radius: 3px; padding: 14px 16px; font-size: 14px; }

.thanks { text-align: center; display: grid; gap: 10px; justify-items: center; }
.thanks .script { font-family: var(--font-script); font-size: 54px; line-height: 1; color: var(--red); }
.thanks p { margin: 0; max-width: 36ch; }
.linkbtn { font: inherit; background: none; border: 0; color: var(--burgundy); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px; }

.coming { display: grid; gap: 12px; border-top: 1px solid var(--rule); padding-top: 24px; }
.coming-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.coming h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 22px; }
.tally { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.tally b { color: var(--red); font-weight: 600; }
.guests { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 18px; }
.guests li { display: flex; justify-content: space-between; gap: 8px; padding-block: 6px; border-bottom: 1px dotted var(--rule); font-size: 15px; min-width: 0; }
.guests li .nm { overflow-wrap: anywhere; }
.guests li .ps { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
.empty { font-size: 14px; color: var(--ink-soft); margin: 0; }

.host { display: grid; gap: 12px; border-top: 1px solid var(--rule); padding-top: 24px; }
.host h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 22px; }
.host .tag { font-family: var(--font-body); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--cream); background: var(--forest); padding: 3px 8px; border-radius: 2px; vertical-align: middle; margin-left: 8px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
th { text-align: left; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--ink); }
td { padding: 8px; border-bottom: 1px dotted var(--rule); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; text-align: center; }
.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.yes { background: var(--forest); color: var(--cream); }
.pill.no { background: var(--cream-deep); color: var(--ink-soft); }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 20px 40px; }
  .cover { position: static; max-width: 520px; margin: 0 auto; width: 100%; }
  .reply-link { display: block; text-align: center; margin-top: 16px; }
  .reply-link a { display: inline-block; color: var(--cream); background: var(--red); text-decoration: none; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; font-size: 13px; padding: 13px 26px; border-radius: 3px; }
  .card { border-radius: 999px 999px 6px 6px / 180px 180px 6px 6px; padding-top: 56px; }
}
@media (max-width: 440px) {
  .row2 { grid-template-columns: 1fr; }
  .when { font-size: 15px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
.host-wrap { grid-template-columns: minmax(0, 1fr); max-width: 900px; }
.host-wrap .card { border-radius: 999px 999px 6px 6px / 200px 200px 6px 6px; }
.login .field { gap: 12px; }
input[type=password] { width: 100%; font: inherit; color: var(--ink); background: #FBF9F3; border: 1px solid var(--rule); border-radius: 3px; padding: 11px 12px; }
</style>
</head>
<body>
<main class="wrap host-wrap">
  <section class="card" aria-labelledby="host-page-title">
    <header class="head">
      <span class="eyebrow">Host view</span>
      <h1 id="host-page-title"><span class="script-name">Markha</span><span class="caps">RSVP replies</span></h1>
      <div class="when"><span>December</span><b>19</b><span>at 7:00 pm</span></div>
    </header>

    <form id="login-form" class="login" novalidate>
      <div id="login" class="field">
        <label class="lbl" for="f-pass">Host password</label>
        <input id="f-pass" type="password" autocomplete="current-password" placeholder="Ilagay ang password">
        <button class="submit" type="submit">Tingnan ang mga reply</button>
      </div>
      <p class="status" id="login-status" role="status"></p>
    </form>

    <section class="coming" id="coming" hidden aria-labelledby="coming-title">
      <div class="coming-head">
        <h2 id="coming-title">Sino ang darating</h2>
        <button class="linkbtn" id="refresh" type="button">I-refresh</button>
      </div>
      <span class="tally" id="tally"></span>
      <ul class="guests" id="guests"></ul>
      <p class="empty" id="empty" hidden>Wala pang nag-reply.</p>
    </section>

    <section class="host" id="host" hidden aria-labelledby="host-title">
      <h2 id="host-title">Lahat ng reply <span class="tag">Host lang</span></h2>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Bisita</th><th>Sagot</th><th>Upuan</th><th>Monito Monita</th><th>Contact</th><th>Message</th></tr></thead>
          <tbody id="host-rows"></tbody>
        </table>
      </div>
    </section>
  </section>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = "markha-host-pass";
  let pass = "";
  try { pass = sessionStorage.getItem(KEY) || ""; } catch (_) {}

  function setStatus(t, err) { $("login-status").textContent = t || ""; $("login-status").classList.toggle("err", !!err); }

  async function load() {
    setStatus("Nilo-load ang mga reply…");
    try {
      const res = await fetch("/api/rsvps", { headers: { "x-admin-password": pass } });
      if (res.status === 401) { setStatus("Mali ang password. Subukan ulit.", true); showLogin(); return; }
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      try { sessionStorage.setItem(KEY, pass); } catch (_) {}
      setStatus("");
      $("login").hidden = true;
      $("coming").hidden = false;
      $("host").hidden = false;
      render(Array.isArray(data.rsvps) ? data.rsvps : []);
    } catch (e) {
      setStatus("Hindi ma-load ang mga reply. I-check ang internet mo at subukan ulit.", true);
      showLogin();
    }
  }
  function showLogin() { $("login").hidden = false; $("coming").hidden = true; $("host").hidden = true; }

  function render(rsvps) {
    const yes = rsvps.filter((r) => r.attending === "yes");
    const no = rsvps.filter((r) => r.attending === "no");
    const seats = yes.reduce((s, r) => s + (Number(r.partySize) || 1), 0);
    const isYes = (v) => v === "yes" || v === true;
    const monito = rsvps.filter((r) => isYes(r.monito)).length;

    const t = $("tally"); t.textContent = "";
    const b = document.createElement("b"); b.textContent = seats;
    t.append(b, document.createTextNode(" upuan · " + yes.length + " darating · " + no.length + " hindi makakapunta · " + monito + " gusto ng Monito Monita"));

    const list = $("guests"); list.textContent = "";
    yes.slice().sort((a, c) => String(a.name).localeCompare(String(c.name))).forEach((r) => {
      const li = document.createElement("li");
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = r.name || "Bisita";
      const ps = document.createElement("span"); ps.className = "ps"; ps.textContent = (Number(r.partySize) || 1) + " upuan";
      li.append(nm, ps); list.append(li);
    });
    $("empty").hidden = yes.length > 0;

    const tb = $("host-rows"); tb.textContent = "";
    const sorted = rsvps.slice().sort((a, c) => String(c.updatedAt || "").localeCompare(String(a.updatedAt || "")));
    if (!sorted.length) {
      const tr = document.createElement("tr"); const td = document.createElement("td");
      td.colSpan = 6; td.className = "empty"; td.textContent = "Lalabas dito ang mga reply habang sumasagot ang mga bisita.";
      tr.append(td); tb.append(tr); return;
    }
    sorted.forEach((r) => {
      const tr = document.createElement("tr");
      const cells = [r.name || "Bisita", null, r.attending === "yes" ? String(r.partySize || 1) : "–", isYes(r.monito) ? "Yes" : (r.monito === "no" || r.monito === false) ? "No" : "–", r.contact || "", r.message || ""];
      cells.forEach((v, i) => {
        const td = document.createElement("td");
        if (i === 1) { const p = document.createElement("span"); p.className = "pill " + (r.attending === "yes" ? "yes" : "no"); p.textContent = r.attending === "yes" ? "Darating" : "Hindi darating"; td.append(p); }
        else td.textContent = v;
        if (i === 2 || i === 3) td.className = "num";
        tr.append(td);
      });
      tb.append(tr);
    });
  }

  $("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    pass = $("f-pass").value;
    if (!pass) { setStatus("Ilagay ang host password.", true); return; }
    load();
  });
  $("refresh").addEventListener("click", load);

  if (pass) load();
})();
</script>
</body>
</html>
